<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Student Marksheet</h1>

        <input type="text" id="name" placeholder="Student Name" />
        <input type="number" id="sub1" placeholder="Maths Marks" />
        <input type="number" id="sub2" placeholder="English Marks" />
        <input type="number" id="sub3" placeholder="Computer Marks" />
        <button onclick="result()">generateMarksheet</button>

        <div class="result">
            <p><strong>Name:</strong> <span id="rName"></span></p>
            <p><strong>Obtained Marks:</strong> <span id="total"></span></p>
            <p><strong>percentage:</strong> <span id="average"></span></p>
            <p><strong>Grade:</strong> <span id="grade"></span></p>
        </div>
    </div>
    <script src="function.js"></script>
</body>
</html>
